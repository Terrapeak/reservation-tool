name: Temporary Reservations E2 Validation
on:
  push:
    branches:
      - reservations-operations-navigation-current-main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reservations-operations-navigation-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - shell: bash
        run: |
          set -e
          find src tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: git diff --check 16dd2b333f30a0ed81c94a0763108dd37d96136c HEAD
      - shell: bash
        run: |
          if git grep -nE '(^|[^A-Za-z])(SUPABASE_SERVICE_ROLE_KEY|PRIVATE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?key|secret)' -- src tests; then
            echo "Potential secret-like content found"
            exit 1
          fi
