name: Temporary Reservations E2 Validation
on:
  push:
    branches:
      - reservations-operations-navigation-current-main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reservations-operations-navigation-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --check 16dd2b333f30a0ed81c94a0763108dd37d96136c HEAD
