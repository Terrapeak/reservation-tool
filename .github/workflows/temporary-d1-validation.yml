name: Temporary D1 Reservations Validation

on:
  push:
    branches:
      - callback-notification-preferences-current-main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check src/restaurant-settings.js
      - run: node --check src/customer-auth-bootstrap.js
