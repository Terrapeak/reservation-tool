<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/admin-ui.css" />
    <link rel="stylesheet" href="/src/universal-booking-admin.css" />
    <link rel="stylesheet" href="/src/service-configuration.css" />
    <link rel="stylesheet" href="/src/public-booking.css" />
    <link rel="stylesheet" href="/src/owner-onboarding.css" />
    <link rel="stylesheet" href="/src/public-ui.css" />
    <link rel="stylesheet" href="/src/customer-view.css" />
    <link rel="stylesheet" href="/src/reservations-management-shell.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraPeak Reservations</title>
  </head>
  <body>
    <script>
      const initialSearchParams = new URLSearchParams(window.location.search)
      if (initialSearchParams.get('customerView') === '1') document.body.classList.add('customer-reservations-view')
      if (window.location.pathname.includes('/dashboard')) {
        const internalPath = window.location.pathname.replace('/dashboard', '/admin')
        window.history.replaceState({}, '', `${internalPath}${window.location.search}${window.location.hash}`)
      }
    </script>
    <div id="app"></div>
    <script type="module">
      import { RESERVATIONS_MANAGEMENT_ROUTE_SET } from '/src/reservations-routes.js'

      const currentPath = window.location.pathname
      const currentParts = currentPath.split('/').filter(Boolean)
      const currentRoute = currentParts.slice(1).join('/')

      if (currentPath === '/template-preview/physio' || currentPath === '/template-preview/physio/') {
        await import('/src/physio-template-preview-page.js')
        await import('/src/physio-modules-preview.js')
      } else if (currentPath === '/onboarding' || currentPath === '/onboarding/') {
        document.querySelector('#app').innerHTML = `
          <main class="auth-card"><h1>Reservations setup is managed by TerraPeak</h1><p>Independent Reservations account and business creation is disabled. Customer access and provisioning are managed by the TerraPeak Platform.</p><p>Please open Reservations from your TerraPeak customer workspace.</p><a href="https://dashboard.terrapeakgroup.com/dashboard/reservations">Open TerraPeak Reservations</a></main>`
      } else if (currentPath.startsWith('/book/')) {
        await import('/src/public-booking.js')
        await import('/src/public-booking-flow.js')
      } else {
        await import('/src/customer-auth-bootstrap.js')
        if (RESERVATIONS_MANAGEMENT_ROUTE_SET.has(currentRoute) && window.__TERRAPEAK_RESERVATIONS_READY__ === true) {
          await import('/src/trusted-management-runtime.js')
          await import('/src/management-entry.js')
          if (currentRoute === 'admin/services') await import('/src/service-test-cleanup.js')
        }
      }
    </script>
    <script type="module">
      if (window.location.pathname.includes('/admin')) {
        const publicPath = window.location.pathname.replace('/admin', '/dashboard')
        window.history.replaceState({}, '', `${publicPath}${window.location.search}${window.location.hash}`)
      }
      const currentPath = window.location.pathname
      if (currentPath.includes('/dashboard/analytics')) document.title = 'TerraPeak Reservations | Analytics'
      else if (currentPath.includes('/dashboard/settings')) document.title = 'TerraPeak Reservations | Settings'
      else if (currentPath.includes('/dashboard/customer-form')) document.title = 'TerraPeak Reservations | Customer Form'
      else if (currentPath.includes('/dashboard')) document.title = 'TerraPeak Reservations'
    </script>
  </body>
</html>
